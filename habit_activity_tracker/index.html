<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A simple daily habit tracker." />
    <title>Habit Tracker</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="app-header">
        <div>
          <p class="eyebrow">Daily routine</p>
          <h1>Habit tracker</h1>
          <p class="today-label" id="todayLabel">Today</p>
        </div>
        <div class="progress-summary" aria-label="Daily progress">
          <span class="progress-value" id="progressValue">0/0</span>
          <span class="progress-caption">approved today</span>
        </div>
      </header>

      <section class="panel add-habit-panel" aria-labelledby="addHabitHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Build consistency</p>
            <h2 id="addHabitHeading">Add a habit</h2>
          </div>
        </div>

        <form id="habitForm" class="habit-form">
          <div class="form-field form-field-wide">
            <label for="habitName">Habit name</label>
            <input id="habitName" name="name" type="text" placeholder="e.g. Drink water" required />
          </div>

          <div class="form-field">
            <label for="habitTime">Setting time <span>(optional)</span></label>
            <input id="habitTime" name="time" type="time" />
          </div>

          <div class="form-field">
            <label for="habitPriority">Priority</label>
            <select id="habitPriority" name="priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>

          <div class="form-field">
            <label for="habitColor">Color</label>
            <input id="habitColor" name="color" type="color" value="#242424" />
          </div>

          <div class="form-field form-field-wide">
            <label for="habitDescription">Description <span>(optional)</span></label>
            <textarea id="habitDescription" name="description" rows="2" placeholder="A little context for your future self"></textarea>
          </div>

          <div class="form-actions">
            <button class="button button-primary" type="submit">Add habit</button>
          </div>
        </form>
      </section>

      <section class="habits-section" aria-labelledby="habitsHeading">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Your routine</p>
            <h2 id="habitsHeading">Today’s habits</h2>
          </div>
        </div>

        <div id="emptyState" class="empty-state">
          <p class="empty-state-title">No habits yet</p>
          <p>Add your first habit above to begin building your routine.</p>
        </div>

        <div id="habitList" class="habit-list" aria-live="polite"></div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
